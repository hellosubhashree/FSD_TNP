    <script>
        var a=0;
        while(a<10){
            document.write("<h1>hello</h>");
            a++;
        }
        var a= Number(prompt("Enter a number:"));
        for(var i=1;i<=10;i++){
            document.write(a + "x" +i+ "=" +(a*i)+ "<br>");
        }
        function myFunction(){
            alert("Hello! I am an alert box!");
        }
        myFunction();

            function greetUser(name) {
                alert("Hello, " +name + "!");
            }
            greetUser("Alice!");
        const meFunction =()=> {
            document.write("Hello, World!");
        }
        meFunction();
    </script>
