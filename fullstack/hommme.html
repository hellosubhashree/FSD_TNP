<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Colour & Image</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, sans-serif;
    }

    body{
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:#ff0000;
    }

    .container{
        text-align:center;
    }

    .box{
        width:300px;
        height:300px;
        border:4px solid #333;
        border-radius:15px;
        overflow:hidden;
        background:#ffffff;
        display:flex;
        justify-content:center;
        align-items:center;
        transition:0.5s;
        margin-bottom:20px;
    }

    .box img{
        width:100%;
        height:100%;
        object-fit:cover;
    }

    button{
        padding:12px 20px;
        margin:8px;
        font-size:16px;
        border:none;
        border-radius:8px;
        cursor:pointer;
        color:white;
        transition:0.3s;
    }

    #colorBtn{
        background:#ff5722;
    }

    #imageBtn{
        background:#2196f3;
    }

    button:hover{
        transform:scale(1.05);
    }
</style>
</head>

<body>

<div class="container">

    <div class="box" id="box">
        <img id="image" src="https://picsum.photos/300?random=1" alt="Image">
    </div>

    <button id="colorBtn">Change Colour</button>
    <button id="imageBtn">Change Image</button>

</div>

<script>

const colors = [
    "#FFCDD2",
    "#C8E6C9",
    "#BBDEFB",
    "#FFF9C4",
    "#D1C4E9",
    "#FFCCBC",
    "#B2EBF2",
    "#F8BBD0"
];

const images = [
    "https://picsum.photos/300?random=1",
    "https://picsum.photos/300?random=2"
];

const box = document.getElementById("box");
const image = document.getElementById("image");
const colorBtn = document.getElementById("colorBtn");
let imageIndex = 0;

let isGreen = false;

colorBtn.onclick = function(){
    isGreen = !isGreen;
    document.body.style.backgroundColor = isGreen ? "green" : "red";
};

document.getElementById("imageBtn").onclick = function(){
    imageIndex = (imageIndex + 1) % images.length;
    image.src = images[imageIndex];
};

</script>

</body>
</html>
