<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
    <style>
        body {
            background-color: beige;
            color:rgb(81, 122, 12);
            font-size: 16px;
            font-family: Arial, sans-serif;
            margin:0;
            padding: 20px;
        }
        h2 {
            color: pink;
            background-color: aquamarine;
            border: 6px dashed white;
            font-size: 60px;
            font-family: 'Courier NEW', Courier, monospace;
            padding-left: 20px;
            margin: 20px;
        }
    </style>
    <style>
        h2 {
    color: red;
}
    </style>
</head>
<body>

    <h2 align="center">Registration Form</h2>

    <form>

        <label style="color: purple;">Full Name:</label><br>
        <input type="text" name="fullname" placeholder="Enter your Name" required><br><br>
       

        <label style="color:pink">Roll Number:</label><br>
        <input type="text" name="roll_number" placeholder="Enter Roll Number" required><br><br>

        <label style="color:palegreen">Email:</label><br>
        <input type="email" name="email" placeholder="Enter your Email" required><br><br>

        <label style="color:palevioletred">Phone Number:</label><br>
        <input type="tel" name="phone"><br><br>

        <label style="color:blueviolet">Date of Birth:</label><br>
        <input type="date" name="dob"><br><br>

        <label style="color:rgb(179, 124, 124)">Gender:</label><br>
        <input type="radio" name="gender" value="Male"> Male
        <input type="radio" name="gender" value="Female"> Female
        <input type="radio" name="gender" value="Other"> Other
        <br><br>

        <label style="color:darkolivegreen">Hobbies:</label><br>
        <input type="checkbox" name="hobby" value="Reading"> Reading
        <input type="checkbox" name="hobby" value="Sports"> Sports
        <input type="checkbox" name="hobby" value="Music"> Music
        <br><br>

        <label style="color:blueviolet">Country:</label><br>
        <select name="country">
            <option>Select Country</option>
            <option>India</option>
            <option>USA</option>
            <option>Canada</option>
            <option>Australia</option>
        </select>
        <br><br>

        <label style="color:darkred">Address:</label><br>
        <textarea name="address" rows="4" cols="30"></textarea>
        <br><br>

        <label style="color:darkgoldenrod">Upload Photo:</label><br>
        <input type="file" name="photo">
        <br><br>

        <input type="submit" value="Register">
        <input type="reset" value="Clear">

    </form>

</body>
</html>
